<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GraceSoft Assistant (Demo)</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>GraceSoft Assistant <span class="demo-badge">Demo data</span></h1>
    <p class="scope-banner" id="scope-banner">Data: 10 Jul 2026 to 10 Sep 2026, redacted</p>
  </header>

  <main>
    <div id="token-gate" class="token-gate">
      <label for="token-input">Demo token</label>
      <input id="token-input" type="password" placeholder="Paste the demo token" autocomplete="off" />
      <button id="token-save">Continue</button>
    </div>

    <div id="chat-app" class="chat-app hidden">
      <div id="starters" class="starters"></div>
      <div id="messages" class="messages" role="log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Ask about hours, cash, overdue cards..." autocomplete="off" maxlength="2000" />
        <button type="submit">Send</button>
      </form>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
